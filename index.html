<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Midnight">
<meta name="theme-color" content="#FBEBF0">
<link rel="apple-touch-icon" href="midnight-apple-touch-icon.png">
<title>Midnight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBEBF0; --card:#FFFFFF; --sunk:#F6DFE7;
  --ink:#2A1A21; --dim:#6A5158; --faint:#9E7C87; --line:#EFD5DE;
  --now:#B32050; --soon:#6A3FA8; --soon-fill:#8A55CC; --calm:#0B7F63;
  --mint:#4ED3AC; --mint-wash:#E7FAF3;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:calc(20px + env(safe-area-inset-top)) 0 6px}
h1{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;margin:0;line-height:1}
.sub{color:var(--dim);font-size:13.5px;margin-top:7px;max-width:44ch}

/* section banding — the separation between urgent and not */
h2{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
   color:var(--faint);margin:0;padding:0 0 12px;display:flex;align-items:center;gap:9px}
h2 .n{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--faint);
      border:1px solid var(--line);border-radius:999px;padding:1px 7px}
h2.crit{color:var(--now)} h2.crit .n{color:var(--now);border-color:var(--now)}
section{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
section:first-of-type{margin-top:22px;border-top:none;padding-top:0}

/* tiles: Today only */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{aspect-ratio:1/1;max-height:190px;min-height:150px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);
  border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;width:100%;overflow:hidden;font-family:inherit;color:inherit;transition:transform .08s}
.tile:active{transform:scale(.985)}
.tile.s-now{border-top-color:var(--now)}
.tile.s-soon{border-top-color:var(--soon-fill)}
.tile.s-calm{border-top-color:var(--calm)}
.t-head{display:flex;gap:7px;align-items:flex-start}
.t-title{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.22;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-meta{color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-num{font-family:var(--display);font-weight:800;font-size:38px;line-height:.9;letter-spacing:-.04em}
.s-now .t-num{color:var(--now)} .s-soon .t-num{color:var(--soon)} .s-calm .t-num{color:var(--calm)}
.t-unit{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-top:5px}
.t-sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub .ok{color:var(--calm)} .t-sub .todo{color:var(--soon);font-weight:700}
.t-act{margin-top:8px;width:100%;border:1px solid var(--mint);background:var(--mint);color:var(--ink);
  border-radius:8px;padding:6px 4px;font-size:12px;font-weight:700;font-family:var(--body)}
.t-act.quiet{background:none;color:var(--dim);border-color:var(--line);font-weight:600}

/* one tick per day */
.ticks{display:flex;gap:2.5px;align-items:flex-end;height:13px;margin-top:8px;overflow:hidden}
.tick{width:2.5px;height:7px;border-radius:2px;background:#E3CBD4;flex:none}
.tick.free{background:var(--calm);opacity:1}
.tick.buffer{background:var(--soon-fill);height:13px}
.tick.over{background:var(--now);height:13px}
.tickmore{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:3px;line-height:1}

/* dose pills */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;
  font-family:var(--mono);color:var(--dim);background:var(--sunk);line-height:1.2}
.pill.done{background:var(--mint-wash);border-color:var(--calm);color:var(--calm)}
.pill.due{border-color:var(--soon-fill);color:var(--soon);background:var(--card)}

/* rows: Stock and Health records */
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;max-width:560px}
.row{display:flex;align-items:flex-start;gap:11px}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:16px;letter-spacing:-.01em}
.meta{color:var(--dim);font-size:13.5px;margin-top:2px}
.meta b{color:var(--ink);font-weight:700}
.num{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:-.02em}
.stat{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
.stat.now{color:var(--now)}.stat.soon{color:var(--soon)}.stat.calm{color:var(--calm)}
.who{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:9px;margin:20px 0 9px}
.chip{width:24px;height:24px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 0 1px rgba(0,0,0,.13)}
.chip.sm{width:13px;height:13px}
.opens{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.open{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--sunk);
  border:1px solid var(--line);border-radius:7px;padding:4px 8px;text-align:left}
.open.live{background:var(--mint-wash);border-color:var(--calm);color:var(--calm)}
.open.bad{border-color:var(--now);color:var(--now);background:var(--card)}
.done-line{color:var(--faint);text-decoration:line-through}

/* buttons */
button{font-family:inherit;font-size:15px;color:inherit;background:none;border:none;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  font-weight:600;font-size:14px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.go{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.btn.quiet{color:var(--dim);background:none}
.btn.danger{color:var(--now);background:none}
.btn.wide{display:block;width:100%;text-align:center;margin-top:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,235,240,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs{display:flex;max-width:760px;margin:0 auto}
.tab{flex:1;padding:13px 4px 15px;text-align:center;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:700;font-family:var(--display)}
.tab.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(42,26,33,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--paper);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 4px;letter-spacing:-.025em}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin:15px 0 5px;font-weight:700}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:11px;color:var(--ink);font-family:inherit;font-size:16px}
.half{display:flex;gap:10px}.half>*{flex:1}
.check{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);display:flex;
  gap:9px;align-items:center;margin:10px 0;font-weight:400}
.check input{width:20px;height:20px;flex:none}
.note{color:var(--dim);font-size:13px;margin-top:9px}
.warn{color:var(--soon);font-size:12.5px;margin-top:5px;font-weight:600}
.empty{color:var(--dim);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.hidden{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);
  padding:11px 16px;border-radius:10px;font-size:14px;max-width:88%;text-align:center;
  z-index:80;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--faint);font-size:12.5px;text-align:center;margin:22px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--calm);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <header><h1 id="hd">Midnight</h1><div class="sub" id="hdsub"></div></header>
  <main id="view"></main>
</div>

<nav><div class="tabs">
  <button class="tab on" data-tab="today">Today</button>
  <button class="tab" data-tab="stock">Stock</button>
  <button class="tab" data-tab="health">Health</button>
  <button class="tab" data-tab="setup">Setup</button>
</div></nav>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
"use strict";
const KEY="nine.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- dates: local YYYY-MM-DD throughout ---------- */
const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=parse(s);d.setMonth(d.getMonth()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const until=s=>daysBetween(today(),s);
const pretty=s=>parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const prettyFull=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});

/* ---------- state ---------- */
let S=load();
const RETIRED_DEFAULTS={"#C98A2B":"#1C6E8C","#6B4BC4":"#1C6E8C","#5B2E9D":"#1C6E8C","#E03B4E":"#D93B4E","#3E72CC":"#3E72CC"};
function migrate(s){
  if(s.v>=3) return s;
  (s.animals||[]).forEach(a=>{ const to=RETIRED_DEFAULTS[(a.color||"").toUpperCase()]; if(to) a.color=to; });
  s.v=3; return s;
}
function load(){
  try{const r=localStorage.getItem(KEY);
    if(r){const s=migrate(JSON.parse(r)); localStorage.setItem(KEY,JSON.stringify(s)); return s;}
  }catch(e){}
  const s=seed(); s.v=3; return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert("Storage is full or blocked. Export a backup from Setup.");}}
function seed(){
  const t=today();
  const churro={id:uid(),name:"Churro",species:"dog",color:"#1C6E8C",tell:""};
  const k1={id:uid(),name:"Cat 1",species:"cat",color:"#D93B4E",tell:"Red collar"};
  const k2={id:uid(),name:"Cat 2",species:"cat",color:"#3E72CC",tell:"Blue collar"};
  return{animals:[churro,k1,k2],
    supplies:[
      {id:uid(),label:"Dog food",who:[churro.id],unit:"kg",pack:12,seed:0.35,lead:3,opens:[{on:t,pack:12}]},
      {id:uid(),label:"Cat food",who:[k1.id,k2.id],unit:"kg",pack:2,seed:0.12,lead:3,opens:[{on:t,pack:2}]},
      {id:uid(),label:"Litter",who:[k1.id,k2.id],unit:"L",pack:10,seed:0.9,lead:3,opens:[{on:t,pack:10}]}],
    vaccines:[],meds:[]};
}
const animal=id=>S.animals.find(a=>a.id===id);
const names=ids=>ids.map(i=>animal(i)?.name||"?").join(" & ");
const supply=id=>S.supplies.find(x=>x.id===id);

/* ---------- forecasting ---------- */
function sortedOpens(sp){return [...sp.opens].sort((a,b)=>a.on<b.on?-1:1);}
function rate(sp){
  const o=sortedOpens(sp); let r=null,n=0;
  for(let i=0;i<o.length-1;i++){
    const days=daysBetween(o[i].on,o[i+1].on);
    if(days<=0) continue;
    const obs=(o[i].pack||sp.pack)/days;
    r=(r===null)?obs:r*0.4+obs*0.6;   // recent opens dominate — kittens grow fast
    n++;
  }
  return{perDay:r??sp.seed,measured:n};
}
function forecast(sp){
  const o=sortedOpens(sp), last=o[o.length-1];
  const{perDay,measured}=rate(sp);
  if(!last||!perDay||perDay<=0) return null;
  const lasts=Math.max(1,Math.round((last.pack||sp.pack)/perDay));
  const runout=addDays(last.on,lasts), buyBy=addDays(runout,-(sp.lead||0));
  return{runout,buyBy,perDay,measured,left:until(runout),toBuy:until(buyBy),
    confidence:measured===0?"estimate":measured===1?"learning":"measured"};
}

/* ---------- meds ---------- */
const medEnd=m=>addDays(m.start,(m.days||1)-1);
function medActive(m){
  if(m.mode==="chronic") return today()>=m.start;
  return today()>=m.start && until(medEnd(m))>=0;
}
const doseKey=(m,d)=>m.log?.[d]||[];
function toggleDose(m,i){
  const d=today(); m.log=m.log||{};
  const arr=m.log[d]?[...m.log[d]]:[];
  arr[i]=arr[i]?null:new Date().toISOString();
  m.log[d]=arr; save(); render();
}

/* ---------- display helpers ---------- */
const grade=d=>d<=0?"now":d<=3?"soon":"calm";
function ticks(daysFree,buffer,cap=18){
  if(daysFree===null||daysFree===undefined) return "";
  let h="";
  if(daysFree<0){for(let i=0;i<Math.min(-daysFree,cap);i++)h+='<span class="tick over"></span>';}
  else{
    const free=Math.max(0,daysFree-buffer), buf=Math.min(daysFree,buffer);
    const shown=Math.min(free,cap);
    for(let i=0;i<shown;i++)h+='<span class="tick free"></span>';
    for(let i=0;i<Math.min(buf,cap-shown);i++)h+='<span class="tick buffer"></span>';
    if(daysFree>cap)h+='<span class="tickmore">+'+(daysFree-cap)+'</span>';
  }
  return '<div class="ticks">'+h+'</div>';
}
function dayLabel(d){
  if(d<0) return d===-1?"1 day late":Math.abs(d)+" days late";
  if(d===0) return "today";
  if(d===1) return "tomorrow";
  return "in "+d+" days";
}

/* ---------- Today: triage only ---------- */
const HORIZON=30;
let tab="today";

function vToday(){
  $("#hd").textContent="Midnight";
  $("#hdsub").textContent="What needs you in the next "+HORIZON+" days. The full records live under Stock and Health.";
  let out="";

  const live=S.meds.filter(medActive);
  if(live.length){
    out+=section("Doses today",live.length,live.some(m=>doseKey(m,today()).filter(Boolean).length<m.times.length),
      live.map(medTile).join(""));
  }

  const items=[];
  S.supplies.forEach(sp=>{const f=forecast(sp);if(f&&f.toBuy<=HORIZON)items.push({kind:"supply",sp,f,d:f.toBuy});});
  S.vaccines.filter(v=>!v.done&&until(v.due)<=HORIZON).forEach(v=>items.push({kind:"vac",v,d:until(v.due)}));
  items.sort((a,b)=>a.d-b.d);

  const bands=[
    ["Overdue",       i=>i.d<0,             true],
    ["Today & tomorrow", i=>i.d>=0&&i.d<=1, true],
    ["This week",     i=>i.d>1&&i.d<=7,     false],
    ["Coming up",     i=>i.d>7&&i.d<=HORIZON, false]
  ];
  let shown=0;
  bands.forEach(([name,test,crit])=>{
    const g=items.filter(test); if(!g.length) return;
    shown+=g.length;
    out+=section(name,g.length,crit,g.map(tileFor).join(""));
  });

  if(!shown&&!live.length) out+='<section><div class="empty">Nothing needs you for a month. Churro and the cats are, for now, fully administered.</div></section>';

  const beyond=S.vaccines.filter(v=>!v.done&&until(v.due)>HORIZON).length;
  if(beyond) out+='<div class="foot">'+beyond+' further date'+(beyond===1?"":"s")+' past '+HORIZON+' days — see Health.</div>';
  $("#view").innerHTML=out;
}
function section(title,count,crit,body){
  return `<section><h2 class="${crit?"crit":""}">${esc(title)}<span class="n">${count}</span></h2><div class="grid">${body}</div></section>`;
}

function tileFor(i){
  if(i.kind==="supply"){
    const{sp,f}=i,g=grade(f.toBuy);
    const head = f.toBuy<0?"Buy it now" : f.toBuy===0?"Buy it today" : "Buy by "+pretty(f.buyBy);
    const act = f.left<=1 ? `<button class="t-act" data-open="${sp.id}">Opened a new one</button>` : "";
    return `<div class="tile s-${g}">
      <div><div class="t-title">${esc(sp.label)}</div>
        <div class="t-meta">${head} · empty ${pretty(f.runout)}</div>
        ${act?"":`<div class="t-sub">${f.perDay.toFixed(2)} ${esc(sp.unit)}/day · ${f.confidence}</div>`}</div>
      <div><div class="t-num">${f.left<0?"0":f.left}</div><div class="t-unit">days left</div>
        ${ticks(f.left,sp.lead||0)}${act}</div></div>`;
  }
  const{v}=i,g=grade(i.d),a=animal(v.animal);
  const act=v.booked?"":`<button class="t-act" data-editvac="${v.id}">Book it</button>`;
  return `<div class="tile s-${g}">
    <div><div class="t-head"><span class="chip sm" style="background:${esc(a?.color||"#999")}"></span>
      <div class="t-title">${esc(v.label)}</div></div>
      <div class="t-meta">${esc(a?.name||"?")} · ${dayLabel(i.d)}</div>
      ${act?"":`<div class="t-sub">${bookLine(v)}</div>`}</div>
    <div><div class="t-num">${Math.abs(i.d)}</div><div class="t-unit">${i.d<0?"days late":"days away"}</div>
      ${ticks(i.d,2)}${act}</div></div>`;
}
function bookLine(v){
  if(v.booked) return `<span class="ok">Booked${v.appt?" "+pretty(v.appt):""}</span>`;
  return `<span class="todo">No appointment yet</span>`;
}
function medTile(m){
  const a=animal(m.animal),log=doseKey(m,today()),done=log.filter(Boolean).length,total=m.times.length;
  const g=done<total?"soon":"calm";
  return `<div class="tile s-${g}">
    <div><div class="t-head"><span class="chip sm" style="background:${esc(a?.color||"#999")}"></span>
      <div class="t-title">${esc(m.label)}</div></div>
      <div class="t-meta">${esc(a?.name||"?")}${m.notes?" · "+esc(m.notes):""}</div></div>
    <div><div class="t-num">${done}<span style="font-size:20px;color:var(--faint)">/${total}</span></div>
      <div class="t-unit">given today</div>
      <div class="pills">${m.times.map((t,i)=>
        `<button class="pill ${log[i]?"done":"due"}" data-med="${m.id}" data-i="${i}">${esc(t)}${log[i]?" ✓":""}</button>`).join("")}</div>
    </div></div>`;
}

/* ---------- Stock: the record ---------- */
function vStock(){
  $("#hd").textContent="Stock";
  $("#hdsub").textContent="Tap “Opened a new one” the day the old one runs out — that gap is the whole measurement. Past openings can be corrected any time.";
  let out="<section>";
  S.supplies.forEach(sp=>{
    const f=forecast(sp);
    if(!f){
      out+=`<div class="rec"><div class="title">${esc(sp.label)}</div>
        <div class="meta">Nothing logged yet, so there's nothing to forecast from.</div>
        <div class="btns"><button class="btn go" data-open="${sp.id}">Opened a new one</button>
        <button class="btn quiet" data-editsup="${sp.id}">Edit</button></div></div>`;
      return;
    }
    const g=grade(f.toBuy);
    const o=sortedOpens(sp).slice(-5).reverse();
    out+=`<div class="rec">
      <div class="row">
        <div class="grow">

/* ---------- ICS ---------- */
const icsEscape=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function fold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=" "+l.slice(73);}out.push(l);return out.join("\r\n");}
const icsDate=s=>s.replace(/-/g,"");
function buildICS(){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Midnight//Pets//EN","CALSCALE:GREGORIAN",
           "X-WR-CALNAME:Midnight — pets","METHOD:PUBLISH"];
  const ev=(u,date,summary,desc,trigger)=>L.push("BEGIN:VEVENT","UID:"+u+"@nine.local","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+icsDate(date),"DTEND;VALUE=DATE:"+icsDate(addDays(date,1)),
      fold("SUMMARY:"+icsEscape(summary)),fold("DESCRIPTION:"+icsEscape(desc)),"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY",fold("DESCRIPTION:"+icsEscape(summary)),"TRIGGER:"+trigger,"END:VALARM","END:VEVENT");
  S.supplies.forEach(sp=>{const f=forecast(sp);if(!f)return;
    ev("nine-sup-"+sp.id,f.buyBy,"Buy "+sp.label,
      `Forecast empty ${pretty(f.runout)} at ${f.perDay.toFixed(2)} ${sp.unit}/day (${f.confidence}). For ${names(sp.who)}.`,"-PT15H");});
  S.vaccines.filter(v=>!v.done).forEach(v=>
    ev("nine-vac-"+v.id,v.due,v.label+" — "+(animal(v.animal)?.name||"?"),
      (v.booked?("Appointment booked"+(v.appt?" for "+pretty(v.appt)+".":".")):"NO appointment booked yet.")+
      (v.confirmed?" Date confirmed with the vet.":" Date not confirmed.")+
      (v.repeat?` Repeats every ${v.repeat} months.`:""),"-P1DT15H"));
  S.meds.forEach(m=>{
    if(m.mode==="course"&&until(medEnd(m))<0)return;
    ev("nine-med-"+m.id,m.start,m.label+" starts — "+(animal(m.animal)?.name||"?"),
      `${m.times.length}×/day at ${m.times.join(", ")}. ${m.mode==="course"?"Last day "+pretty(medEnd(m))+".":"Ongoing."} ${m.notes||""}`,"-PT15H");
    if(m.mode==="course") ev("nine-medend-"+m.id,medEnd(m),m.label+" — last day",
      "Final doses today for "+(animal(m.animal)?.name||"?")+".","-PT15H");});
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function download(name,text,type){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-med],[data-open],[data-detailsup],[data-detailvac],[data-editsup],[data-editvac],[data-editmed],[data-editani],[data-editopen],[data-saveopen],[data-delopen],[data-setdate],[data-vdone],[data-savesup],[data-savevac],[data-savemed],[data-saveani],[data-delsup],[data-delvac],[data-delmed],[data-delani],[data-confirmopen],[data-close],[data-ics],[data-export],[data-import],[data-template]");
  if(!t) return;
  const d=t.dataset;

  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return;}
  if(d.close){closeSheet();return;}
  if(d.med){toggleDose(S.meds.find(x=>x.id===d.med),+d.i);return;}
  if(d.setdate){$("#f_on").value=addDays(today(),parseInt(d.setdate));return;}

  if(d.detailsup){sheetDetailSup(d.detailsup);return;}
  if(d.detailvac){sheetDetailVac(d.detailvac);return;}

  if(d.open){sheetOpen(d.open);return;}
  if(d.confirmopen){
    const sp=supply(d.confirmopen);
    const on=$("#f_on").value||today(), pack=parseFloat($("#f_size").value)||sp.pack;
    const dup=sp.opens.findIndex(x=>x.on===on);
    if(dup>=0){
      if(!confirm("You already logged a "+sp.label.toLowerCase()+" opened on "+prettyFull(on)+
        ".\n\nReplace that entry? Two on one day would tell the app a pack lasted zero days."))return;
      sp.opens[dup]={on,pack};
    } else sp.opens.push({on,pack});
    save();closeSheet();render();
    const f=forecast(sp);
    toast(f?`Logged. ${sp.label} should last until ${prettyFull(f.runout)}.`:"Logged.");
    return;}
  if(d.editopen){sheetEditOpen(d.editopen,+d.idx);return;}
  if(d.saveopen){
    const sp=supply(d.saveopen),o=sp.opens[+d.idx];
    o.on=$("#f_on").value||o.on; o.pack=parseFloat($("#f_size").value)||o.pack;
    save();closeSheet();render();return;}
  if(d.delopen){
    const sp=supply(d.delopen); sp.opens.splice(+d.idx,1);
    save();closeSheet();render();return;}

  if(d.editsup){sheetSupply(d.editsup);return;}
  if(d.savesup){
    const isNew=d.new==="true", sp=isNew?{id:d.savesup,opens:[]}:supply(d.savesup);
    sp.label=$("#f_label").value.trim()||"Supply";
    sp.pack=parseFloat($("#f_pack").value)||1;
    sp.unit=$("#f_unit").value.trim()||"kg";
    sp.seed=parseFloat($("#f_seed").value)||0.1;
    sp.lead=parseInt($("#f_lead").value)||0;
    sp.who=[...document.querySelectorAll(".f_who:checked")].map(x=>x.value);
    if(isNew){sp.opens=[{on:today(),pack:sp.pack}];S.supplies.push(sp);}
    save();closeSheet();render();return;}
  if(d.delsup){S.supplies=S.supplies.filter(x=>x.id!==d.delsup);save();closeSheet();render();return;}

  if(d.editvac){sheetVaccine(d.editvac);return;}
  if(d.savevac){
    const isNew=d.new==="true", v=isNew?{id:d.savevac,done:false}:S.vaccines.find(x=>x.id===d.savevac);
    v.label=$("#f_label").value.trim()||"Vet date";
    v.animal=$("#f_animal").value; v.due=$("#f_due").value||today();
    v.repeat=parseInt($("#f_rep").value)||0; v.confirmed=$("#f_conf").checked;
    v.booked=$("#f_book").checked; v.appt=$("#f_appt").value||"";
    if(isNew)S.vaccines.push(v);
    save();closeSheet();render();return;}
  if(d.delvac){S.vaccines=S.vaccines.filter(x=>x.id!==d.delvac);save();closeSheet();render();return;}
  if(d.vdone){
    const v=S.vaccines.find(x=>x.id===d.vdone);
    if(v.repeat){v.due=addMonths(today(),v.repeat);v.confirmed=false;v.booked=false;v.appt="";} else v.done=true;
    save();closeSheet();render();return;}

  if(d.editmed){sheetMed(d.editmed);return;}
  if(d.savemed){
    const isNew=d.new==="true", m=isNew?{id:d.savemed,log:{}}:S.meds.find(x=>x.id===d.savemed);
    m.label=$("#f_label").value.trim()||"Medication";
    m.animal=$("#f_animal").value; m.mode=$("#f_mode").value;
    m.days=parseInt($("#f_days").value)||1; m.start=$("#f_start").value||today();
    m.times=$("#f_times").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!m.times.length)m.times=["08:00"];
    m.notes=$("#f_notes").value.trim();
    if(isNew)S.meds.push(m);
    save();closeSheet();render();return;}
  if(d.delmed){S.meds=S.meds.filter(x=>x.id!==d.delmed);save();closeSheet();render();return;}

  if(d.editani){sheetAnimal(d.editani);return;}
  if(d.saveani){
    const isNew=d.new==="true", a=isNew?{id:d.saveani}:animal(d.saveani);
    a.name=$("#f_name").value.trim()||"Unnamed";
    a.species=$("#f_species").value; a.color=$("#f_color").value; a.tell=$("#f_tell").value.trim();
    if(isNew)S.animals.push(a);
    save();closeSheet();render();return;}
  if(d.delani){
    S.animals=S.animals.filter(x=>x.id!==d.delani);
    S.supplies.forEach(sp=>sp.who=sp.who.filter(i=>i!==d.delani));
    save();closeSheet();render();return;}

  if(d.template){
    const T=TEMPLATES[d.template];
    const who=S.animals.filter(a=>a.species===T.species);
    if(!who.length){alert("Add a "+T.species+" first.");return;}
    const base=today();
    who.forEach(c=>T.rows.forEach(([label,off,rep])=>
      S.vaccines.push({id:uid(),animal:c.id,label,due:addDays(base,off),repeat:rep,confirmed:false,booked:false,appt:"",done:false})));
    save();render();
    alert("Added for "+who.map(a=>a.name).join(" and ")+", dated from today, every row marked unconfirmed.\n\nThese are placeholders, not advice. Overwrite each date with what the vet writes in the cartilla and delete anything that doesn't apply — the Leishmaniasis and sandfly rows are there because of where you live, not because I know Churro needs them.");
    return;}

  if(d.ics){download("midnight-pets.ics",buildICS(),"text/calendar");return;}
  if(d.export){download("midnight-backup-"+today()+".json",JSON.stringify(S,null,2),"application/json");return;}
  if(d.import){
    const f=$("#fileIn");
    f.onchange=()=>{
      const file=f.files[0]; if(!file)return;
      const r=new FileReader();
      r.onload=()=>{try{const j=JSON.parse(r.result);
        if(!j.animals||!j.supplies)throw 0;
        S=j;save();render();alert("Backup restored.");
      }catch(err){alert("That file isn't a Midnight backup.");}};
      r.readAsText(file);};
    f.click();return;}
});

render();
</script>
</body>
</html>
